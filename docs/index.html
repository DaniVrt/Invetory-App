<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Υλικό Inventory</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <h1>📦 Υλικό</h1>
    <div id="user-bar" class="hidden">
      <span id="user-email"></span>
      <button id="logout-btn" class="btn-ghost">Log out</button>
    </div>
  </header>

  <main class="container">

    <!-- AUTH SCREEN -->
    <section id="auth-section" class="card">
      <div class="tabs">
        <button id="tab-login" class="tab active">Log in</button>
        <button id="tab-signup" class="tab">Sign up</button>
      </div>

      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit" class="btn-primary">Log in</button>
      </form>

      <form id="signup-form" class="hidden">
        <input type="email" id="signup-email" placeholder="Email" required />
        <input type="password" id="signup-password" placeholder="Password (min 6 chars)" required minlength="6" />
        <button type="submit" class="btn-primary">Sign up</button>
      </form>

      <button type ="button" id="show-forgot-password" class="btn-ghost">Forgot password?</button>
      <form id="forgot-password-form" class="hidden">
        <input type="email" id="forgot-email" placeholder="Your email" required />
        <button type="submit" class="btn-primary">Send reset link</button>
        <button type="button" id="cancel-forgot-password" class="btn-ghost">Back to login</button>
      </form>

      <!-- Shown only after the user clicks the reset link in their email -->
      <form id="new-password-form" class="hidden">
        <input type="password" id="new-password" placeholder="New password (min 6 chars)" required minlength="6" />
        <button type="submit" class="btn-primary">Set new password</button>
      </form>

      <p id="auth-status" class="status"></p>
    </section>

    <!-- WAREHOUSE PICKER -->
    <section id="warehouse-section" class="card hidden">
      <h2>Your Warehouses</h2>
      <ul id="warehouse-list" class="list"></ul>

      <details class="create-warehouse">
        <summary>+ Create a new warehouse</summary>
        <form id="create-warehouse-form">
          <input type="text" id="new-warehouse-name" placeholder="Warehouse name (e.g. Troop 214 Storage)" required />
          <button type="submit" class="btn-primary">Create</button>
        </form>
      </details>

      <p id="warehouse-status" class="status"></p>

      <button id="open-super-admin" class="btn-ghost hidden">🛡 Manage All Participants</button>
    </section>

    <!-- SUPER ADMIN: GLOBAL DASHBOARD (only visible to super admins) -->
    <section id="super-admin-section" class="hidden">
      <div class="app-header">
        <button id="back-from-super-admin" class="btn-ghost">← Warehouses</button>
        <h2>All Participants</h2>
        <span></span>
      </div>

      <h3>All Warehouses</h3>
      <ul id="all-warehouses-list" class="list"></ul>

      <form id="global-add-member-form" class="card">
        <h3>Add someone to a warehouse</h3>
        <label>Warehouse
          <select id="global-member-warehouse"></select>
        </label>
        <label>Email of an existing account
          <input type="email" id="global-member-email" required />
        </label>
        <label>Role
          <select id="global-member-role">
            <option value="member">Member</option>
            <option value="admin">Admin</option>
          </select>
        </label>
        <button type="submit" class="btn-primary">Add</button>
        <p id="global-member-status" class="status"></p>
      </form>

      <h3>Everyone, across every warehouse</h3>
      <ul id="all-members-list" class="list"></ul>
    </section>

    <!-- MAIN APP -->
    <section id="app-section" class="hidden">

      <div class="app-header">
        <button id="back-to-warehouses" class="btn-ghost">← Warehouses</button>
        <h2 id="current-warehouse-name"></h2>
        <span id="current-role" class="badge"></span>
      </div>

      <nav class="app-nav">
        <button id="nav-inventory" class="nav-btn active">Inventory</button>
        <button id="nav-add" class="nav-btn">Add Item</button>
        <button id="nav-admin" class="nav-btn hidden">Manage Members</button>
      </nav>

      <!-- INVENTORY VIEW -->
      <div id="view-inventory" class="view">
        <div class="filter-row">
          <select id="category-filter">
            <option value="">All categories</option>
          </select>
          <label class="checkbox-label">
            <input type="checkbox" id="expired-only" />
            Show expired as of
          </label>
          <input type="date" id="expired-as-of" />
        </div>
        <ul id="product-list" class="list"></ul>
      </div>

      <!-- ADD ITEM VIEW -->
      <div id="view-add" class="view hidden">
        <form id="add-product-form" class="card">
          <label>Name
            <input type="text" id="product-name" required />
          </label>

          <label>Category
            <input type="text" id="product-category" list="category-options" placeholder="e.g. Rope, Pharmacy" required />
            <datalist id="category-options"></datalist>
          </label>

          <label>Quantity
            <input type="number" id="product-quantity" min="0" value="1" required />
          </label>

          <label class="checkbox-label">
            <input type="checkbox" id="product-has-expiration" />
            This item has an expiration date
          </label>

          <label id="expiration-field" class="hidden">Expiration date
            <input type="date" id="product-expiration" />
          </label>

          <button type="submit" class="btn-primary">Add to inventory</button>
          <p id="add-status" class="status"></p>
        </form>
      </div>

      <!-- ADMIN VIEW -->
      <div id="view-admin" class="view hidden">
        <form id="add-member-form" class="card">
          <h3>Add a member</h3>
          <label>Email of an existing account
            <input type="email" id="member-email" required />
          </label>
          <label>Role
            <select id="member-role">
              <option value="member">Member</option>
              <option value="admin">Admin</option>
            </select>
          </label>
          <button type="submit" class="btn-primary">Add member</button>
          <p id="member-status" class="status"></p>
        </form>

        <h3>Current members</h3>
        <ul id="member-list" class="list"></ul>
      </div>

    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
